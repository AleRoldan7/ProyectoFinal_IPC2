<div *ngIf="mensaje" class="alert" [ngClass]="{
    'alert-success': tipoMensaje === 'success',
    'alert-danger': tipoMensaje === 'danger'
}">
  {{ mensaje }}
</div>

<div class="container mt-4">
  <h3>Comprar Boletos</h3>

  <!-- Cine -->
  <div class="mb-3">
    <label>Cine:</label>
    <select class="form-select" [(ngModel)]="cineElegido" (change)="cargarSalasPorCine()">
      <option [ngValue]="null">-- Selecciona --</option>
      <option *ngFor="let cine of cines" [ngValue]="cine">{{ cine.nombreCine }}</option>
    </select>
  </div>

  <!-- Sala -->
  <div class="mb-3" *ngIf="cineElegido">
    <label>Sala:</label>
    <select class="form-select" [(ngModel)]="salaElegida" (change)="cargarPeliculasPorSalaYCine()">
      <option [ngValue]="null">-- Selecciona --</option>
      <option *ngFor="let sala of salas" [ngValue]="sala">{{ sala.nombreSala }}</option>
    </select>
  </div>

  <!-- Película -->
  <div class="mb-3" *ngIf="salaElegida && peliculasDisponibles?.length">
    <label>Película:</label>
    <select class="form-select" [(ngModel)]="peliculaElegida" (change)="seleccionarPelicula()">
      <option [ngValue]="null">-- Selecciona --</option>
      <option *ngFor="let pelicula of peliculasDisponibles" [ngValue]="pelicula.idPeliculaSala">
        {{ pelicula.tituloPelicula }}
      </option>
    </select>
  </div>

  <!-- Asientos -->
  <div *ngIf="peliculaElegida">
    <h5 class="text-center">Asientos disponibles</h5>
    <div class="sala-preview"
         [style.display]="'grid'"
         [style.gridTemplateRows]="'repeat(' + salaElegida?.filaSala + ', 40px)'"
         [style.gridTemplateColumns]="'repeat(' + salaElegida?.columnaSala + ', 40px)'">
      <div class="asiento"
           *ngFor="let asiento of asientos; let i = index"
           [class.ocupado]="ocupados[i]"
           [class.seleccionado]="asientos[i]"
           (click)="toggleAsiento(i)">
      </div>
    </div>

    <div class="mt-3">
      <p>Boletos seleccionados: {{ asientoElegido.length }}</p>
      <p>Total a pagar: ${{ totalCompra() }}</p>
      <button class="btn btn-primary w-100" (click)="comprarBoletos()">Comprar Boletos</button>
    </div>
  </div>
</div>
