<div class="container mt-4">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-primary text-white text-center">
      <h3 class="mb-0">
        <i class="fas fa-film"></i> REPORTE DE PELÍCULAS PROYECTADAS
      </h3>
      <small class="d-block">{{ nombreCine }} | {{ usuarioNombre }}</small>
    </div>

    <div class="card-body">
      <form (ngSubmit)="generarReporte()" #form="ngForm" class="row g-3">
        <div class="col-md-3">
          <label class="form-label fw-bold">Desde</label>
          <input type="date" class="form-control" [(ngModel)]="fechaInicio" name="fechaInicio" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold">Hasta</label>
          <input type="date" class="form-control" [(ngModel)]="fechaFin" name="fechaFin" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Sala (opcional)</label>
          <select class="form-select" [(ngModel)]="idSala" name="idSala">
            <option [ngValue]="null">Todas las salas</option>
            <option *ngFor="let sala of salas" [ngValue]="sala.idSalaCine">
              {{ sala.nombreSala }}
            </option>
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-success w-100" [disabled]="!form.valid">
            <i class="fas fa-search"></i> FILTRAR
          </button>
        </div>
      </form>

      <div class="mt-4">
        <button class="btn btn-danger float-end" (click)="descargarPDF()" [disabled]="peliculas.length === 0">
          <i class="fas fa-file-pdf"></i> DESCARGAR PDF
        </button>
      </div>

      <div class="table-responsive mt-4" *ngIf="peliculas.length > 0">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-primary">
            <tr>
              <th>SALA</th>
              <th>PELÍCULA</th>
              <th>FECHA</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of peliculas">
              <td><strong class="text-primary">{{ p.nombreSala }}</strong></td>
              <td>{{ p.tituloPelicula }}</td>
              <td class="text-center">{{ p.fecha | date:'dd/MM/yyyy' }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="peliculas.length === 0 && mostrarResultado" class="alert alert-info text-center mt-4">
        <i class="fas fa-info-circle"></i> No se encontraron películas en el rango seleccionado.
      </div>
    </div>
  </div>
</div>
