<div *ngIf="mensaje" class="alert" [ngClass]="{
    'alert-success': tipoMensaje === 'success',
    'alert-danger': tipoMensaje === 'danger'
  }">
  {{ mensaje }}
</div>

<div class="container mt-4">
  <h3>Asignar Cine a Administrador</h3>

  <div class="row">
    <div class="col-md-6">
      <label class="form-label">Nombre del cine:</label>
      <input type="text" [(ngModel)]="nombreCine" class="form-control" />

      <label class="form-label mt-2">Costo:</label>
      <input type="number" [(ngModel)]="costoCine" class="form-control" disabled="" />

      <label class="form-label mt-2">Fecha creación:</label>
      <input type="date" [(ngModel)]="fechaCreacion" class="form-control" />

      <button class="btn btn-primary mt-3" (click)="asignarCine()">Asignar Cine</button>
      <a routerLink="/admin-sistema" class="cartera-back mt-2">Regresar</a>
    </div>

    <div class="col-md-6">
      <h5>Administradores de Cine</h5>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>User</th>
            <th>Seleccionar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let admin of admins">
            <td>{{ admin.idUsuario }}</td>
            <td>{{ admin.nombre }}</td>
            <td>{{ admin.userName }}</td>
            <td>
              <button class="btn btn-outline-primary btn-sm" (click)="seleccionarAdmin(admin)">
                Seleccionar
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <p *ngIf="adminSeleccionado"><strong>Seleccionado:</strong> {{ adminSeleccionado.nombre }}</p>
    </div>
  </div>
</div>
